        <title id="architecture-title">AhtapotAgent mimarisi</title>
        <desc id="architecture-desc">İnsan web arayüzünden orkestratör sunucusuna bağlanır; sunucu durumu SQLite'ta tutar, agent'ları Docker sandbox'ında Claude API ile koşturur, iş başına worktree ve canlı ortam açar, değişiklikleri GitHub'a PR olarak iter.</desc>

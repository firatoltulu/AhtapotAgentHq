<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-flow-title agent-flow-desc" id="agent-flow-root">
        <title id="agent-flow-title">AhtapotAgent iş akışı</title>
        <desc id="agent-flow-desc">İnsan işi girer ve planı onaylar; Planner, Developer, QA ve DevOps agent'ları sırayla çalışır; sistem build eder; insan canlı ortamı porttan test eder ve PR'ı onaylar; build, canlı test, QA ya da PR'da kusur çıkarsa iş Developer'a döner.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #agent-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #agent-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #agent-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #agent-flow-root .note { font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.05rem;
      color: var(--color-muted);
      margin-top: 1rem;
      max-width: 60ch; }
      @media print {
#agent-flow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="agent-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="agent-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zaman ekseni -->
        <text x="176" y="64" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace" letter-spacing="0.18em">ZAMAN →</text>

        <!-- Şerit çizgileri -->
        <line x1="40" y1="80" x2="1240" y2="80" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <line x1="40" y1="200" x2="1240" y2="200" stroke="#2d3142" stroke-width="1" stroke-opacity="0.10"/>
        <line x1="40" y1="320" x2="1240" y2="320" stroke="#2d3142" stroke-width="1" stroke-opacity="0.10"/>
        <line x1="40" y1="440" x2="1240" y2="440" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <line x1="160" y1="80" x2="160" y2="440" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>

        <!-- Şerit adları -->
        <text x="56" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace" letter-spacing="0.18em">İNSAN</text>
        <text x="56" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace" letter-spacing="0.18em">AGENT</text>
        <text x="56" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace" letter-spacing="0.18em">SİSTEM</text>

        <!-- Oklar (kutulardan önce) -->
        <path d="M 280,140 H 340 Q 348,140 348,148 V 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-flow-arrow)"/>
        <path d="M 400,260 H 460 Q 468,260 468,252 V 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-flow-arrow)"/>
        <path d="M 520,140 H 580 Q 588,140 588,148 V 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-flow-arrow)"/>
        <path d="M 640,260 H 700 Q 708,260 708,268 V 352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-flow-arrow)"/>
        <path d="M 760,380 H 820 Q 828,380 828,372 V 168" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#agent-flow-arrow-accent)"/>
        <path d="M 880,140 H 940 Q 948,140 948,148 V 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-flow-arrow)"/>
        <path d="M 1000,260 H 1060 Q 1068,260 1068,252 V 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-flow-arrow)"/>
        <path d="M 1120,140 H 1180 Q 1188,140 1188,148 V 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-flow-arrow)"/>

        <!-- Geri dönüş: kusur bulunursa Developer'a -->
        <path d="M 948,288 V 416 Q 948,424 940,424 H 596 Q 588,424 588,416 V 288" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#agent-flow-arrow)"/>

        <!-- Ok etiketleri -->
        <rect x="836" y="282" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="860" y="291" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">PORTTAN</text>

        <rect x="776" y="404" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="820" y="413" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">KUSUR · DÜZELT</text>

        <!-- Adım 1: İş gir (insan) -->
        <rect x="176" y="112" width="104" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="176" y="112" width="104" height="56" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="228" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">İş gir</text>
        <text x="228" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace" text-anchor="middle">Draft</text>

        <!-- Adım 2: Planner -->
        <rect x="296" y="232" width="104" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="232" width="104" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="348" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Planner</text>
        <text x="348" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace" text-anchor="middle">Planning</text>

        <!-- Adım 3: Plan onayı (insan) -->
        <rect x="416" y="112" width="104" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="416" y="112" width="104" height="56" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="468" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Plan onayı</text>
        <text x="468" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace" text-anchor="middle">PlanReview</text>

        <!-- Adım 4: Developer -->
        <rect x="536" y="232" width="104" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="536" y="232" width="104" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="588" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Developer</text>
        <text x="588" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace" text-anchor="middle">Developing</text>

        <!-- Adım 5: Build (sistem) -->
        <rect x="656" y="352" width="104" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="656" y="352" width="104" height="56" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="708" y="378" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Build</text>
        <text x="708" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace" text-anchor="middle">Building</text>

        <!-- Adım 6: Canlı test (insan, odak) -->
        <rect x="776" y="112" width="104" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="776" y="112" width="104" height="56" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="828" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Canlı test</text>
        <text x="828" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace" text-anchor="middle">LiveTest</text>

        <!-- Adım 7: QA -->
        <rect x="896" y="232" width="104" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="896" y="232" width="104" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="948" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">QA</text>
        <text x="948" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace" text-anchor="middle">QACases · QA</text>

        <!-- Adım 8: PR onayı (insan) -->
        <rect x="1016" y="112" width="104" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="1016" y="112" width="104" height="56" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="1068" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">PR onayı</text>
        <text x="1068" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace" text-anchor="middle">PRReview</text>

        <!-- Adım 9: DevOps -->
        <rect x="1136" y="232" width="104" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="1136" y="232" width="104" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="1188" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">DevOps</text>
        <text x="1188" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace" text-anchor="middle">CIWatch → Done</text>

        <!-- Lejant -->
        <line x1="40" y1="472" x2="1240" y2="472" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace" letter-spacing="0.18em">LEJANT</text>

        <rect x="40" y="508" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="60" y="516" fill="#4f5d75" font-size="9" font-family="'Geist', 'Segoe UI', Helvetica, Arial, sans-serif">İnsan kararı</text>

        <rect x="164" y="508" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="184" y="516" fill="#4f5d75" font-size="9" font-family="'Geist', 'Segoe UI', Helvetica, Arial, sans-serif">Agent adımı</text>

        <rect x="288" y="508" width="14" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="308" y="516" fill="#4f5d75" font-size="9" font-family="'Geist', 'Segoe UI', Helvetica, Arial, sans-serif">Sistem adımı</text>

        <rect x="416" y="508" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="436" y="516" fill="#4f5d75" font-size="9" font-family="'Geist', 'Segoe UI', Helvetica, Arial, sans-serif">Canlı ortam, insan porttan dener</text>

        <line x1="624" y1="513" x2="652" y2="513" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#agent-flow-arrow)"/>
        <text x="660" y="516" fill="#4f5d75" font-size="9" font-family="'Geist', 'Segoe UI', Helvetica, Arial, sans-serif">Kusurda Developer'a dönüş</text>
      </svg>
